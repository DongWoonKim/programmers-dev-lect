    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: fb44fad539553103bcb93d798526b34a
            client-secret: j9u1rFmlIpnNLhGz5e0t0ciZsJGSGcvc
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
